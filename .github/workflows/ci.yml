# Basic checks, no secrets, no game data, no GPU. Every command is also runnable locally (CONTRIBUTING.md, "CI").
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Actions are pinned to a full commit SHA (the comment names the release); Dependabot (github-actions) raises them.
jobs:
  check:
    name: check.sh and unit tests
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - run: scripts/check.sh --tree --tests

  privacy:
    name: privacy and identity gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Commits of the change (pull request) or of the push
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: scripts/ci/range.sh >> "$GITHUB_ENV"
      - name: Game data, secrets, personal paths, commit e-mails and added lines
        run: scripts/ci/privacy.sh

  lint:
    name: ruff, shellcheck, formats
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.12' }
      - name: ruff
        run: pip install ruff==0.17.5 && ruff check .
      - name: shellcheck (baseline in .shellcheckrc)
        run: git ls-files -z '*.sh' | xargs -0 shellcheck -S warning
      - name: components.lock format
        run: python3 scripts/ci/check_components_lock.py
      - name: Pipeline list records (games/*/pipelines.kyplst.verified)
        run: scripts/ci/check_kyplst_records.sh
      - name: Markdown links (internal)
        run: python3 scripts/ci/check_md_links.py

  workflows:
    name: workflow syntax (actionlint)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - name: actionlint 1.7.7 (release tarball, sha256 checked)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tgz" https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
