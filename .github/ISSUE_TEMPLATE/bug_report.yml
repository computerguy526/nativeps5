name: Bug report
description: A title or test crashes, hangs, stops, or renders wrongly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Search open and closed issues for the error text first, and comment there if it is already reported.
        A new title goes into the [Game bring-up](https://github.com/computerguy526/nativeps5/issues/new?template=game_bringup.yml) form, a slow scene into the [Performance](https://github.com/computerguy526/nativeps5/issues/new?template=performance.yml) form.
        Read [CONTRIBUTING.md](https://github.com/computerguy526/nativeps5/blob/main/CONTRIBUTING.md) ("Never game data") before you attach anything. Paste text; do not attach files from a game.
  - type: input
    id: summary
    attributes:
      label: What happens
      description: One sentence, with the exact error text if there is one.
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: Title ID and version
      description: For example `PPSA21564` and its content version, or the test or homebrew name.
    validations:
      required: true
  - type: input
    id: scene
    attributes:
      label: Where in the title
      description: Boot, menu, cutscene, level name, or the step that fails.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Commands and settings, from a clean checkout if you can.
      placeholder: |
        1. scripts/nps5 run PPSAxxxxx --scene ...
        2. ...
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: How often
      options:
        - Every time
        - Most runs
        - Sometimes
        - Once
        - Not tried again
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        **Attach the zip from `scripts/nps5 bug-report`** (drag it into the "What happened" box below, or into a comment). It holds the trimmed log, `nps5 doctor`, commits, settings, versions and any crash report, redacted, text only; `--dry-run` lists what goes in. Open it and read it first. Details: [docs/reference/logging.md](https://github.com/computerguy526/nativeps5/blob/main/docs/reference/logging.md).
  - type: checkboxes
    id: bugzip
    attributes:
      label: Bug report zip
      options:
        - label: I attached the `nps5 bug-report` zip, or there was no run to report (say why below)
          required: true
  - type: textarea
    id: doctor
    attributes:
      label: "`scripts/nps5 doctor` output (only if you did not attach the zip)"
      render: text
  - type: textarea
    id: report
    attributes:
      label: "Extra evidence (optional): `nps5 report <run>` output, or the lines around the failure"
      render: text
  - type: input
    id: machine
    attributes:
      label: Mac model, macOS and Xcode (also in the zip)
      placeholder: MacBook Pro M4 Pro 24 GB, macOS 26.1, Xcode 26.1
    validations:
      required: true
  - type: textarea
    id: commits
    attributes:
      label: Component commits (also in the zip: write "in the zip")
      description: "`components.lock` of the checkout, or the commits `nps5 doctor` prints (nativeps5, ps5recomp, Kyty / AnyPS5, KosmicKrisp), plus any local changes."
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: Settings and environment switches (also in the zip: write "in the zip")
      description: Every `NPS5_*`, `KYTY_*`, `APS5_*` or other switch you set, and `nps5.conf` changes. Say "defaults" if none.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: No game files, shaders, journals, frame dumps, caches or anything extracted from a game attached
          required: true
  - type: dropdown
    id: ai
    attributes:
      label: AI assistance
      description: Did an AI agent help write this report? If yes, a person has read it and the evidence.
      options:
        - "No"
        - "Yes"
    validations:
      required: true
